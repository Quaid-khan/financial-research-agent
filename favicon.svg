<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- QK Brand Emblem Monogram -->
  <g transform="translate(4, 4)">
    <!-- Letter 'Q' Circle Body -->
    <path d="M 23 16 C 14.5 16 7.5 23 7.5 31.5 C 7.5 40 14.5 47 23 47 C 27.2 47 31 45.3 33.8 42.5 L 40 48.5 L 44 44.5 L 37.8 38.5 C 37.9 36.3 38.5 33.9 38.5 31.5 C 38.5 23 31.5 16 23 16 Z M 23 23 C 27.7 23 31.5 26.8 31.5 31.5 C 31.5 36.2 27.7 40 23 40 C 18.3 40 14.5 36.2 14.5 31.5 C 14.5 26.8 18.3 23 23 23 Z" fill="url(#accentGrad)"/>
    
    <!-- Letter 'K' Spine & Financial Trend Accent -->
    <rect x="42" y="16" width="6.5" height="31" rx="2" fill="url(#accentGrad)"/>
    <path d="M 44.5 29.5 L 53.5 16.5 L 59 16.5 L 49.5 30 L 60 47.5 L 54 47.5 Z" fill="url(#emeraldGrad)"/>
  </g>

  <!-- Small Financial Chart Growth Indicator Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#22c55e"/>
</svg>
